name: Claim Watch daily scan

on:
  schedule:
    # 10:00 UTC = 6:00 AM ET (5:00 AM during EST; adjust if you care)
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dateutil

      - name: Run scraper
        env:
          # Optional: define a VENDORS repo secret (one vendor per line)
          # to keep your vendor list out of the public repo. If unset,
          # vendors.txt in the repo is used instead.
          VENDORS: ${{ secrets.VENDORS }}
        run: python scraper.py

      - name: Commit results
        run: |
          git config user.name "claim-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git pull --rebase origin main
          git push
